[project]
name = "energy-pipeline"
version = "0.1.0"
description = "European day-ahead electricity price pipeline (ENTSO-E -> Iceberg lakehouse)"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    # Orchestration
    "dagster==1.9.11",
    "dagster-webserver==1.9.11",
    "dagster-postgres==0.25.11",
    # Lakehouse
    "pyiceberg[s3fs,pyarrow]==0.8.1",
    "pyarrow>=18.0.0",
    "duckdb>=1.1.3",
    # HTTP + parsing
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    # Config + types
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.dagster]
module_name = "energy_pipeline.definitions"
code_location_name = "energy_pipeline"
