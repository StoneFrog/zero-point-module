[project]
name = "energy-pipeline"
version = "0.1.0"
description = "European day-ahead electricity price pipeline (ENTSO-E -> Iceberg lakehouse)"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    # Orchestration
    "dagster==1.9.11",
    "dagster-webserver==1.9.11",
    "dagster-postgres==0.25.11",
    # dagster's "library" packages version in lockstep with dagster-postgres
    # above (0.25.11 <-> dagster 1.9.11), not with dagster-core's own scheme.
    "dagster-dbt==0.25.11",
    # Lakehouse
    "pyiceberg[s3fs,pyarrow]==0.8.1",
    "pyarrow>=18.0.0",
    # >=1.5.0: DuckDB's `iceberg` extension is a core, multi-arch (incl.
    # linux_arm64) extension only from roughly this version on — the old
    # 1.1.3-era pin here was community-only and amd64-only, which is why
    # dbt's staging model used to read a local Parquet handoff instead of
    # iceberg_scan() directly. See dbt_project/profiles.yml and
    # LEARNING.md's Phase 3 notes. Couldn't verify the exact lower bound
    # without network access — confirm with `docker compose build`.
    "duckdb>=1.5.0",
    # dbt (Phase 3): gold-layer transformations as SQL models w/ tests + docs.
    # Range-pinned, not exact — this was authored without network access to
    # verify which dbt-core/dbt-duckdb patch versions actually resolve
    # together for dagster 1.9.11 and duckdb>=1.5; tighten to exact versions
    # once `uv sync` resolves them for real (uv.lock will pin it regardless).
    "dbt-core>=1.9,<1.11",
    "dbt-duckdb>=1.9,<1.11",
    # HTTP + parsing
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    # Config + types
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.dagster]
module_name = "energy_pipeline.definitions"
code_location_name = "energy_pipeline"
