name: energy_pipeline
version: "1.0.0"
config-version: 2

# Matches the `energy_pipeline:` target block in profiles.yml (co-located in
# this directory — see profiles.yml's header comment for why).
profile: energy_pipeline

# dbt phones home with anonymous usage statistics by default, and generates
# dbt_project/.user.yml (a per-installation UUID) on first run to identify
# itself across invocations. Off here: this pipeline runs unattended in
# containers, so nobody is around to weigh the trade, and a data pipeline
# shouldn't make outbound calls nobody asked for. `dbt clean` and the
# gitignored .user.yml are the only traces left behind.
flags:
  send_anonymous_usage_stats: false

# The window sizes int_gold_cheapest_windows computes, declared once here so
# the model and the test that checks its coverage cannot disagree about which
# set they are talking about — a test defaulting to a different list than the
# model would either check windows nobody asked for or quietly check a subset
# and pass. Dagster overrides this per run from WINDOW_HOURS in
# assets/gold_windows.py (via --vars); tests/test_dbt_project_files.py pins the
# two lists together, since dbt can't read the Python one.
vars:
  window_hours: [1, 2, 3, 4, 6, 8]

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  energy_pipeline:
    staging:
      # Pass-through read of one partition's worth of silver rows. No reason
      # for this to exist as its own table/view — inlined as a CTE wherever
      # `ref()`'d.
      +materialized: ephemeral
    gold:
      # Each dbt invocation is scoped to one delivery_date (via the required
      # `delivery_date` var, enforced in the staging model), so a full
      # CREATE OR REPLACE TABLE per run is already minimal — no incremental
      # materialization needed.
      +materialized: table
