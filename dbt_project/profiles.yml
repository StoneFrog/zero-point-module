# Committed (not gitignored) because it holds no secrets — every credential
# comes from env_var(), same as the rest of this repo's config.
#
# Uses DuckDB's `httpfs`/`iceberg` extensions to read silver directly via
# `iceberg_scan()` in the staging model. This needs duckdb>=1.5.0 (see
# pyproject.toml's comment) — the `iceberg` extension only became a core,
# multi-arch (incl. linux_arm64) extension around that version. Below that,
# it was community-only and amd64-only, which is why this project used to
# route silver through a local Parquet handoff written by Python instead —
# see git history / LEARNING.md's Phase 3 notes for that era's reasoning.
#
# Co-located in the project directory rather than ~/.dbt/profiles.yml so the
# container just needs one `--profiles-dir` pointed here; see
# docker-compose.yml's dagster service commands, which run `dbt parse`
# against this before starting.
energy_pipeline:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Scratch database for dbt's own materializations — not the lake.
      # Gold models here are read back out and pushed into Iceberg by
      # assets/gold_dbt.py, the same way the old Python gold assets did.
      # Rebuilt fresh every run; nothing durable lives in this file.
      path: "target/gold.duckdb"
      schema: main
      extensions:
        - httpfs
        - iceberg
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT').replace('http://', '').replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
        s3_region: "{{ env_var('S3_REGION') }}"
        s3_use_ssl: "{{ 'true' if env_var('S3_ENDPOINT').startswith('https://') else 'false' }}"
        s3_url_style: "path"
