version: 2

models:
  - name: int_gold_prices_daily_stats
    description: >
      Daily price statistics per zone (min/max/avg/spread/peak/cheapest hour)
      for one delivery_date. Published to Iceberg (`gold.prices_daily_stats`)
      by the `gold_prices_daily_stats` Dagster asset in assets/gold_dbt.py.
    columns:
      - name: delivery_date
        description: Calendar day these stats cover.
        tests: [not_null]
      - name: bidding_zone
        description: ENTSO-E bidding zone code (see entsoe/zones.py).
        tests: [not_null]
      - name: min_price_eur_per_mwh
        tests: [not_null]
      - name: max_price_eur_per_mwh
        tests: [not_null]
      - name: avg_price_eur_per_mwh
        tests: [not_null]
      - name: spread_eur_per_mwh
        description: max_price_eur_per_mwh - min_price_eur_per_mwh.
        tests: [not_null]
      - name: cheapest_hour_utc
        tests: [not_null]
      - name: peak_hour_utc
        tests: [not_null]
      - name: n_intervals
        description: Row count this zone contributed (23-25 for hourly zones across DST; up to 96 for quarter-hourly).
        tests: [not_null]
      - name: computed_at_utc
        tests: [not_null]

  - name: int_gold_cheapest_windows
    description: >
      Cheapest contiguous N-hour price window per (delivery_date,
      bidding_zone, window_hours), for the smart-home load-shifting use case.
      Published to Iceberg (`gold.prices_cheapest_windows`) by the
      `gold_cheapest_windows` Dagster asset in assets/gold_dbt.py.
    columns:
      - name: delivery_date
        tests: [not_null]
      - name: bidding_zone
        tests: [not_null]
      - name: window_hours
        tests: [not_null]
      - name: window_start_utc
        tests: [not_null]
      - name: window_end_utc
        tests: [not_null]
      - name: avg_price_eur_per_mwh
        tests: [not_null]
      - name: computed_at_utc
        tests: [not_null]
