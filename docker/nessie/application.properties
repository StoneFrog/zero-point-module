# Nessie + Iceberg REST catalog configuration.
#
# Why a file instead of env vars: Quarkus's secret-URN resolver looks up secret
# values from MicroProfile Config by literal property name. Env vars with
# encoded paths (e.g. NESSIE_CATALOG_SECRETS_MINIO_NAME) aren't always wired
# back to the dotted property name unless declared via @ConfigMapping. A
# properties file sets the literal property names directly.
#
# `${VAR}` interpolations resolve from the container's environment, which we
# still set via docker-compose for non-secret values like DB user/pass.

# ---- Version store: Postgres-backed ----
nessie.version.store.type=JDBC2
nessie.version.store.persist.jdbc.datasource=postgresql
quarkus.datasource.postgresql.jdbc.url=jdbc:postgresql://postgres:5432/nessie
quarkus.datasource.postgresql.username=${POSTGRES_USER}
quarkus.datasource.postgresql.password=${POSTGRES_PASSWORD}

# ---- Iceberg catalog: single warehouse on MinIO ----
nessie.catalog.default-warehouse=warehouse
nessie.catalog.warehouses.warehouse.location=s3://${LAKE_BUCKET}/warehouse/

# ---- S3 (MinIO) endpoint options ----
nessie.catalog.service.s3.default-options.region=${S3_REGION}
nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
nessie.catalog.service.s3.default-options.path-style-access=true

# ---- S3 credentials set directly on the access-key composite ----
# We do not use the secret-URN indirection (urn:nessie-secret:quarkus:...)
# because Quarkus's strict config validation rejects any property path that
# isn't declared in an @ConfigMapping schema. There's no generic
# `nessie.catalog.secrets.*` namespace exposed by Nessie 0.99 for arbitrary
# secret entries.
#
# Setting .name and .secret directly on access-key works because BasicCredentials
# is a declared @ConfigMapping with those exact subkeys.
nessie.catalog.service.s3.default-options.access-key.name=${MINIO_ROOT_USER}
nessie.catalog.service.s3.default-options.access-key.secret=${MINIO_ROOT_PASSWORD}
